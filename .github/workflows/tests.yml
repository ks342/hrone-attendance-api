name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["6.0", "7.0"]
        python: ["3.11", "3.12"]
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})' || mongo --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: attendance_db
      MONGO_DB_TEST: attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: app starts and reports healthy
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 40); do curl -sf localhost:8000/health && exit 0; sleep 0.5; done; exit 1
      - run: pytest -q
